name: Postopia CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04  # Update to ubuntu-24.04

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      # Step 4: Decode and save the keystore file securely
      - name: Decode and save keystore
        run: |
          mkdir -p ./keys
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > ./keys/Key-Store

      # Step 5: Build the Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/keys/Key-Store
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Step 6: Upload Release APK as an artifact (Updated to v4)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # Step 7: Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        run: |
          echo "${{ secrets.FIREBASE_AUTH_JSON }}" > firebase-auth.json
          npm install -g firebase-tools
          firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --token "$(firebase login:ci --json --token=$(cat firebase-auth.json))"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-auth.json

      # Step 8: Cleanup keystore and Firebase credentials
      - name: Cleanup sensitive files
        run: |
          rm -rf ./keys
          rm -f firebase-auth.json

