name: Quigam CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04  # Update to ubuntu-24.04

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      # Step 4: Decode and save the keystore file securely
      - name: Decode and save keystore
        run: |
          mkdir -p ./keys
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > ./keys/Key-Store
          ls -l ./keys/Key-Store

#      # Step 5: Bump version code and version name
#      - name: Bump version code and version name
#        run: |
#          VERSION_CODE=$(date +%Y%m%d%H%M%S) # Use current timestamp for version code
#          VERSION_NAME="1.0.$VERSION_CODE"   # Format version name as 1.0.X
#
#          # Update version code and version name in build.gradle
#          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" app/build.gradle
#          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" app/build.gradle

      # Step 6: Build the Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/keys/Key-Store
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Step 7: Upload Release APK as an artifact (Updated to v4)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # Step 8: Cleanup keystore file for added security
      - name: Cleanup keystore
        run: rm -rf ./keys

  # Download Artifact Job (if needed for post-build actions)
  download-artifact:
    runs-on: ubuntu-24.04  # Update to ubuntu-24.04
    needs: build

    steps:
      - name: Download Release APK (Updated to v4)
        uses: actions/download-artifact@v4  # Updated to v4
        with:
          name: release-apk
          path: ./downloaded-apk